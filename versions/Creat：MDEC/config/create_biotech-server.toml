#Reusable capture nets. Health is measured in hit points (2 HP = 1 heart).
[captureNet]
	#Maximum current health that this net can capture.
	# Default: 8.0
	# Range: 0.5 ~ 1024.0
	woodenMaxHealth = 8.0
	#Maximum current health that this net can capture.
	# Default: 12.0
	# Range: 0.5 ~ 1024.0
	stoneMaxHealth = 12.0
	#Maximum current health that this net can capture.
	# Default: 20.0
	# Range: 0.5 ~ 1024.0
	ironMaxHealth = 20.0
	#Maximum current health that this net can capture.
	# Default: 16.0
	# Range: 0.5 ~ 1024.0
	goldenMaxHealth = 16.0
	#Maximum current health that this net can capture.
	# Default: 30.0
	# Range: 0.5 ~ 1024.0
	diamondMaxHealth = 30.0
	#Maximum current health that this net can capture.
	# Default: 40.0
	# Range: 0.5 ~ 1024.0
	netheriteMaxHealth = 40.0
	#Escape time at the net's health limit, in seconds.
	# Default: 5
	# Range: 1 ~ 3600
	fastestEscapeSeconds = 5
	#Escape time as captured health approaches zero, in seconds. The larger of the two escape-time settings is always used as the slow end. Mimics and assembled bionic creatures always use the slow end.
	# Default: 120
	# Range: 1 ~ 3600
	slowestEscapeSeconds = 120
	#Fraction of maximum durability lost after a successful escape, rounded up. Unbreaking applies normally.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	escapeDurabilityFraction = 0.1
	#Cooldown after a successful escape, in seconds.
	# Default: 10
	# Range: 0 ~ 3600
	escapeCooldownSeconds = 10

