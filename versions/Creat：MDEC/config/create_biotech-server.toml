#Anatomical base-stat calibration. Formula overrides belong in data/create_biotech/bionic_stats/. Invalid anchor combinations retain the previous valid calibration.
[bionicStats]
	#Health ceiling; both health anchors are preserved by recalibration.
	# Default: 400.0
	# Range: 1.001 ~ 1024.0
	health_maximum = 400.0
	#First health anchor volume in cubic blocks (standard zombie).
	# Default: 0.40625
	# Range: 1.0E-9 ~ 262144.0
	health_anchor_volume = 0.40625
	#First health anchor value; must be below the second anchor and ceiling.
	# Default: 20.0
	# Range: 1.0 ~ 1023.0
	health_anchor_value = 20.0
	#Second health anchor volume (complete ravager); must exceed the first volume.
	# Default: 5.184234619140625
	# Range: 1.0E-9 ~ 262144.0
	health_second_anchor_volume = 5.184234619140625
	#Second health anchor value; must be below the ceiling.
	# Default: 100.0
	# Range: 1.0 ~ 1023.0
	health_second_anchor_value = 100.0
	#Land-speed ceiling after anatomical multipliers.
	# Default: 0.6
	# Range: 1.0E-6 ~ 1024.0
	movement_maximum = 0.6
	#First effective-leg-length anchor in blocks.
	# Default: 0.75
	# Range: 1.0E-6 ~ 64.0
	leg_anchor_length = 0.75
	#Length-only speed at the first leg anchor.
	# Default: 0.23
	# Range: 1.0E-6 ~ 1024.0
	leg_anchor_speed = 0.23
	#Second effective-leg-length anchor; must exceed the first.
	# Default: 1.875
	# Range: 1.0E-6 ~ 64.0
	leg_second_anchor_length = 1.875
	#Second length-only speed; anchors must describe a saturating length curve.
	# Default: 0.36
	# Range: 1.0E-6 ~ 1024.0
	leg_second_anchor_speed = 0.36
	#Ground speed for zero or one grounded leg.
	# Default: 0.23
	# Range: 0.0 ~ 1024.0
	hopping_speed = 0.23
	#Flight speed at 100 percent active flight tissue.
	# Default: 0.6
	# Range: 1.0E-6 ~ 1024.0
	flight_maximum = 0.6
	#Active-flight-tissue ratio at the flight anchor.
	# Default: 0.25
	# Range: 1.0E-6 ~ 0.999999
	flight_anchor_ratio = 0.25
	#Flight speed at the anchor; must be below flight_maximum.
	# Default: 0.3
	# Range: 1.0E-6 ~ 1024.0
	flight_anchor_speed = 0.3
	#Base movement attribute while specialist swimming is active.
	# Default: 1.0
	# Range: 0.0 ~ 1024.0
	swimming_speed = 1.0
	#Equipment-free base melee damage before arm geometry.
	# Default: 3.0
	# Range: 0.0 ~ 2048.0
	base_attack_damage = 3.0
	#Innate resistance before inherited trait contributions.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	base_knockback_resistance = 0.0
	#Base detection range before special-attack range requirements.
	# Default: 35.0
	# Range: 0.0 ~ 2048.0
	base_follow_range = 35.0
	#Asymptotic arm DPS multiplier; must exceed arm_anchor_dps_scale.
	# Default: 4.0
	# Range: 1.0E-6 ~ 1024.0
	arm_dps_maximum = 4.0
	#Arm-volume DPS anchor in cubic blocks (standard zombie arm).
	# Default: 0.046875
	# Range: 1.0E-9 ~ 262144.0
	arm_anchor_volume = 0.046875
	#DPS multiplier at arm_anchor_volume.
	# Default: 1.0
	# Range: 1.0E-6 ~ 1024.0
	arm_anchor_dps_scale = 1.0
	#Equivalent arm thickness at the interval anchor, in blocks.
