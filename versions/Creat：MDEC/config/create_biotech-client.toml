enableShulkerTeleporterCameraOffset = true
enableShulkerTeleporterPlayerClipping = true
#Render experience in Create fluid tanks as a conventional fluid instead of experience orbs.
renderExperienceAsFluid = false
#Render captured creatures on cardboard box fronts. Disable to use the packager-style face and skip entity icon caches.
renderCapturedEntitiesOnBoxes = true
#Show donor creatures on bionic trait JEI pages and enable species trait lookups from previews, spawn eggs and filled boxes. Synchronizes donor data while JEI is available; disable to stop requesting it from the server.
showBionicTraitDonorsInJei = true
#Show the melee attack range preview while bionic creatures swing their arms.
showBionicAttackRange = false

[creeperBlastChamber]
	enableExplosionParticles = true

[universalJoint]
	# Default: 16
	# Range: 0 ~ 256
	previewRange = 16

[beltParticles]
	# Default: 0.035
	# Range: 0.0 ~ 1.0
	slimeBeltBaseChance = 0.035
	# Default: 0.008
	# Range: 0.0 ~ 1.0
	slimeBeltLengthChance = 0.008
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	slimeBeltSpeedChance = 0.12
	# Default: 0.18
	# Range: 0.0 ~ 1.0
	slimeBeltMaxChance = 0.18
	# Default: 0.025
	# Range: 0.0 ~ 1.0
	magmaBeltBaseChance = 0.025
	# Default: 0.006
	# Range: 0.0 ~ 1.0
	magmaBeltLengthChance = 0.006
	# Default: 0.16
	# Range: 0.0 ~ 1.0
	magmaBeltMaxChance = 0.16
